appId: com.gerdoo.focusbar
productName: Gerdoo
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - resources/**/*
  - '!resources/gerdoo-calendar'
  - package.json
# The EventKit helper must stay outside the asar so it can be executed, and so
# macOS can attribute the Calendar permission to a stable binary on disk.
extraResources:
  - from: resources/gerdoo-calendar
    to: gerdoo-calendar
# Ad-hoc signs the bundle. Without a Developer ID certificate electron-builder
# skips signing, leaving Electron's own linker signature — which no longer
# matches the repacked app, so macOS calls it damaged and refuses to open it.
# `afterPack` rather than `afterSign`: the latter is skipped when no signing
# occurred, which is exactly the case this handles.
afterPack: scripts/adhoc-sign.mjs
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64]
  darkModeSupport: true
  # Menu-bar app: no Dock icon, no app switcher entry.
  extendInfo:
    LSUIElement: true
    NSCalendarsUsageDescription: Gerdoo shows your current and next calendar events on the Focus Bar.
    NSCalendarsFullAccessUsageDescription: Gerdoo shows your current and next calendar events on the Focus Bar.
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
