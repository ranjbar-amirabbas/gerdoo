appId: com.gerdoo.focusbar
productName: Gerdoo
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - resources/**/*
  - '!resources/gerdoo-calendar'
  - package.json
# Ad-hoc signs the macOS bundle. Without a Developer ID certificate
# electron-builder skips signing, leaving Electron's own linker signature —
# which no longer matches the repacked app, so macOS calls it damaged and
# refuses to open it. `afterPack` rather than `afterSign`: the latter is skipped
# when no signing occurred, which is exactly the case this handles. The hook
# returns immediately on every other platform.
afterPack: scripts/adhoc-sign.mjs
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64]
  darkModeSupport: true
  # Menu-bar app: no Dock icon, no app switcher entry.
  extendInfo:
    LSUIElement: true
    NSCalendarsUsageDescription: Gerdoo shows your current and next calendar events on the Focus Bar.
    NSCalendarsFullAccessUsageDescription: Gerdoo shows your current and next calendar events on the Focus Bar.
  # The EventKit helper must stay outside the asar so it can be executed, and so
  # macOS can attribute the Calendar permission to a stable binary on disk. It
  # is a Mach-O binary, so only the macOS build carries it.
  extraResources:
    - from: resources/gerdoo-calendar
      to: gerdoo-calendar
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]
nsis:
  # A tray app belongs in the user's own profile: a per-machine install needs
  # elevation, which is a lot to ask of a focus timer.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  # Windows attributes notifications to a Start menu shortcut, so an installed
  # build needs one for `new Notification` to appear at all.
  createStartMenuShortcut: true
  shortcutName: Gerdoo
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}
